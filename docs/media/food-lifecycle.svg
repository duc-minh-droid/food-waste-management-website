<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .bg { fill: #f7faf5; }
    .node { fill: #ffffff; stroke: #1d7a3c; stroke-width: 2; }
    .warn { fill: #fff4dc; stroke: #f0a020; stroke-width: 2; }
    .bad { fill: #fdecec; stroke: #d65353; stroke-width: 2; }
    .good { fill: #e3f6e5; stroke: #33b440; stroke-width: 2.5; }
    .t { fill: #1b2a20; font-size: 15px; font-weight: 700; }
    .s { fill: #4b5d51; font-size: 12.5px; }
    .h { fill: #0e3b22; font-size: 20px; font-weight: 800; }
    .e { font-size: 26px; }
    .ln { stroke: #1d7a3c; stroke-width: 2; fill: none; }
    .lnr { stroke: #d65353; stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
    .lab { fill: #1d7a3c; font-size: 12px; font-weight: 700; }
    .labr { fill: #b54343; font-size: 12px; font-weight: 700; }
    .ah { fill: #1d7a3c; } .ahr { fill: #d65353; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #10180f; }
      .node { fill: #17241a; stroke: #60e26c; }
      .warn { fill: #2b2210; } .bad { fill: #2c1616; } .good { fill: #16301b; }
      .t { fill: #e8f2ea; } .s { fill: #a9bcae; } .h { fill: #b6f0bc; }
      .ln { stroke: #60e26c; } .ah { fill: #60e26c; } .lab { fill: #7fe28a; } .labr { fill: #f08a8a; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahr" d="M0 0L10 5L0 10z"/></marker>
  </defs>
  <rect class="bg" width="960" height="380" rx="18"/>
  <text class="h" x="32" y="44">The life of an ingredient</text>
  <text class="s" x="32" y="66">What each screen does with one item, and where the app tries to stop it reaching the bin</text>

  <rect class="node" x="32" y="100" width="180" height="96" rx="14"/>
  <text class="e" x="48" y="136">🛒</text>
  <text class="t" x="84" y="134">Shopping list</text>
  <text class="s" x="48" y="162">search → add, set qty</text>
  <text class="s" x="48" y="180">tick when bought</text>

  <path class="ln" d="M212 148 H 262" marker-end="url(#a)"/>
  <text class="lab" x="216" y="138">tick</text>

  <rect class="node" x="264" y="100" width="180" height="96" rx="14"/>
  <text class="e" x="280" y="136">🧺</text>
  <text class="t" x="316" y="134">Inventory</text>
  <text class="s" x="280" y="162">chip per item</text>
  <text class="s" x="280" y="180">click → nutrition, expiry</text>

  <path class="ln" d="M444 148 H 494" marker-end="url(#a)"/>
  <text class="lab" x="446" y="138">set date</text>

  <rect class="warn" x="496" y="100" width="190" height="96" rx="14"/>
  <text class="e" x="512" y="136">⏰</text>
  <text class="t" x="548" y="134">Expiring</text>
  <text class="s" x="512" y="162">sorted soonest first</text>
  <text class="s" x="512" y="180">bar: 10 days → 0</text>

  <path class="ln" d="M686 148 H 736" marker-end="url(#a)"/>
  <text class="lab" x="690" y="138">cook</text>

  <rect class="good" x="738" y="100" width="190" height="96" rx="14"/>
  <text class="e" x="754" y="136">🍲</text>
  <text class="t" x="790" y="134">Recipes</text>
  <text class="s" x="754" y="162">rank: most owned,</text>
  <text class="s" x="754" y="180">then fewest missing</text>

  <path class="ln" d="M833 196 C 833 360, 122 360, 122 200" marker-end="url(#a)"/>
  <text class="lab" x="330" y="352">"Add missing to shopping list" closes the loop</text>

  <path class="lnr" d="M591 196 V 236" marker-end="url(#r)"/>
  <rect class="bad" x="520" y="238" width="142" height="40" rx="10"/>
  <text class="t" x="534" y="263">🗑 expired</text>
  <text class="labr" x="508" y="263" text-anchor="end">"Already expired. Remove it?"</text>
</svg>
