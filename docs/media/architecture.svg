<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .bg { fill: #f7faf5; }
    .box { fill: #ffffff; stroke: #1d7a3c; stroke-width: 2; }
    .soft { fill: #ecf5ed; stroke: #91bd96; stroke-width: 1.5; }
    .demo { fill: #fff4dc; stroke: #f0a020; stroke-width: 2; }
    .ghost { fill: none; stroke: #9aa89e; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .t { fill: #1b2a20; font-size: 15px; font-weight: 700; }
    .s { fill: #4b5d51; font-size: 12.5px; }
    .h { fill: #0e3b22; font-size: 20px; font-weight: 800; }
    .lab { fill: #1d7a3c; font-size: 12px; font-weight: 700; }
    .labd { fill: #9a6400; font-size: 12px; font-weight: 700; }
    .ln { stroke: #1d7a3c; stroke-width: 2; fill: none; }
    .lnd { stroke: #f0a020; stroke-width: 2; fill: none; }
    .ah { fill: #1d7a3c; }
    .ahd { fill: #f0a020; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #10180f; }
      .box { fill: #17241a; stroke: #60e26c; }
      .soft { fill: #1d2e21; stroke: #3f7a4a; }
      .demo { fill: #2b2210; stroke: #f0a020; }
      .ghost { stroke: #5d6b61; }
      .t { fill: #e8f2ea; } .s { fill: #a9bcae; } .h { fill: #b6f0bc; }
      .lab { fill: #7fe28a; } .labd { fill: #f5c060; }
      .ln { stroke: #60e26c; } .ah { fill: #60e26c; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahd" d="M0 0L10 5L0 10z"/></marker>
  </defs>
  <rect class="bg" width="960" height="560" rx="18"/>
  <text class="h" x="32" y="44">WasteLess architecture</text>
  <text class="s" x="32" y="66">React SPA; every page talks to one data module, which picks a backend at build time</text>

  <!-- browser -->
  <rect class="soft" x="32" y="90" width="560" height="440" rx="16"/>
  <text class="lab" x="52" y="116">BROWSER  (Create React App, React 18, framer-motion)</text>

  <rect class="box" x="56" y="132" width="160" height="62" rx="12"/>
  <text class="t" x="72" y="158">LandingPage</text><text class="s" x="72" y="178">/</text>
  <rect class="box" x="232" y="132" width="160" height="62" rx="12"/>
  <text class="t" x="248" y="158">InventoryPage</text><text class="s" x="248" y="178">/inventory</text>
  <rect class="box" x="408" y="132" width="160" height="62" rx="12"/>
  <text class="t" x="424" y="158">ShoppingPage</text><text class="s" x="424" y="178">/shoppingList</text>

  <rect class="box" x="232" y="212" width="336" height="58" rx="12"/>
  <text class="t" x="248" y="237">Inventory · Expiring · Recipes · RecipePage</text>
  <text class="s" x="248" y="257">IngredientSearch · Modal · Toast (shared components)</text>

  <path class="ln" d="M400 270 V 312" marker-end="url(#a)"/>
  <rect class="box" x="176" y="314" width="392" height="70" rx="12" stroke-width="2.5"/>
  <text class="t" x="196" y="342">services/index.js  →  api</text>
  <text class="s" x="196" y="364">useUser · useInventory · useShopping · findRecipes · getRecipe</text>

  <path class="lnd" d="M290 384 V 426" marker-end="url(#ad)"/>
  <text class="labd" x="120" y="412">no keys / DEMO_MODE</text>
  <rect class="demo" x="56" y="428" width="300" height="84" rx="12"/>
  <text class="t" x="72" y="454">services/demo.js</text>
  <text class="s" x="72" y="474">localStorage "wasteless-demo-v1"</text>
  <text class="s" x="72" y="492">47 ingredients · 12 recipes (demoData.js)</text>

  <path class="ln" d="M500 384 V 426" marker-end="url(#a)"/>
  <rect class="box" x="380" y="428" width="188" height="84" rx="12"/>
  <text class="t" x="396" y="454">services/live.js</text>
  <text class="s" x="396" y="474">Firebase SDK + fetch</text>
  <text class="s" x="396" y="492">REACT_APP_* env vars</text>

  <!-- cloud -->
  <text class="lab" x="640" y="116">HOSTED SERVICES  (live mode only)</text>
  <rect class="box" x="640" y="132" width="288" height="78" rx="12"/>
  <text class="t" x="656" y="160">Firebase Auth</text>
  <text class="s" x="656" y="182">Google sign-in popup</text>
  <rect class="box" x="640" y="226" width="288" height="96" rx="12"/>
  <text class="t" x="656" y="254">Cloud Firestore</text>
  <text class="s" x="656" y="276">inventory {userID, foodID, name, expiryDate}</text>
  <text class="s" x="656" y="296">shoppingList {userID, foodID, quantity}</text>
  <rect class="box" x="640" y="338" width="288" height="96" rx="12"/>
  <text class="t" x="656" y="366">Spoonacular API</text>
  <text class="s" x="656" y="388">/food/ingredients/search, /information</text>
  <text class="s" x="656" y="408">/recipes/findByIngredients, /information</text>

  <path class="ln" d="M568 460 C 610 460, 600 172, 638 172" marker-end="url(#a)"/>
  <path class="ln" d="M568 470 C 615 470, 605 274, 638 274" marker-end="url(#a)"/>
  <path class="ln" d="M568 480 C 620 480, 610 386, 638 386" marker-end="url(#a)"/>

  <rect class="ghost" x="640" y="452" width="288" height="60" rx="12"/>
  <text class="t" x="656" y="478" opacity=".7">backend/ (Django 5.2)</text>
  <text class="s" x="656" y="498">scaffold only: /admin, not called by the app</text>
</svg>
